plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.kaleidoswap.rgb'
version = '0.1.0'

android {
  namespace "com.kaleidoswap.rgb"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // RGB-Tools' official Kotlin bindings; needs compileSdk 36 (aar-metadata minCompileSdk).
  implementation "org.rgbtools:rgb-lib-android:0.3.0-beta.7"
}
