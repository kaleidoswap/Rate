plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.kaleidoswap.rgb'
version = '0.1.0'

android {
  namespace "com.kaleidoswap.rgb"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Paired with the iOS bfa.8 release. See libs/README.md for artifact checksums.
  implementation "com.utexo:rgb-lib-bfa-android:0.3.0-beta.7-upstream-dev-bfa.8-bfa"
}
