group = 'com.kaleidoswap.rgb'
namespace "com.kaleidoswap.rgb"

android {
    namespace "com.kaleidoswap.rgb"
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    // BFA AAR from UTEXO-Protocol (bfa.6, matching iOS bfa.8 when available).
    implementation files('libs/rgb-lib-bfa-android-0.3.0-beta.7-upstream-dev-bfa.6-bfa.aar')
    implementation "com.facebook.react:react-native:+"
}
