group = 'com.kaleidoswap.rgb'
namespace "com.kaleidoswap.rgb"

android {
    namespace "com.kaleidoswap.rgb"
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    // Standard rgb-lib from Maven. BFA AAR is in libs/ for when the
    // binding/binary mismatch is resolved.
    implementation "org.rgbtools:rgb-lib-android:0.3.0-beta.7"
    implementation "com.facebook.react:react-native:+"
}
