group = 'com.kaleidoswap.rgb'
namespace "com.kaleidoswap.rgb"

def bfaAar = file('libs/rgb-lib-bfa-android-0.3.0-beta.7-upstream-dev-bfa.6-bfa.aar')

android {
    namespace "com.kaleidoswap.rgb"
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36
    }

    lintOptions {
        abortOnError false
    }
}

if (bfaAar.exists()) {
    dependencies {
        implementation files(bfaAar.path)
    }
} else {
    // BFA AAR not downloaded yet: use the standard rgb-lib from Maven.
    // See modules/kaleido-rgb/android/libs/README.md to download the BFA AAR.
    dependencies {
        implementation "org.rgbtools:rgb-lib-android:0.3.0-beta.7"
    }
}

dependencies {
    implementation "com.facebook.react:react-native:+"
}
