# The QVAC / bare-kit native toolchain (bare-pack, bare-link, the bare-kit
# ios/android link.mjs) assumes a flat node_modules: it resolves the project
# root as <pkg>/../../.. and resolves sibling addon packages by walking up
# node_modules. pnpm's default symlinked .pnpm layout breaks all of this —
# the project root resolves inside .pnpm and the native addons (llamacpp,
# whispercpp, …) never get linked into the app, crashing loadModel at runtime.
#
# Hoisted layout makes react-native-bare-kit and every @qvac/* addon real,
# top-level directories so the linker finds them. Keep this for QVAC to work.
#
# pnpm >=10 no longer reads node-linker from .npmrc — it must be declared
# here in pnpm-workspace.yaml.
nodeLinker: hoisted

# Security overrides for transitive dependencies (GitHub issue #37). Each pins a
# vulnerable package to its patched release within the same major version.
# markdown-it is the one major bump (10 -> 14, pulling linkify-it 5): it renders
# chat messages via react-native-markdown-display, and the old versions have
# quadratic-time DoS paths reachable from message content. Covered by
# components/chat/markdownRender.test.tsx.
# uuid is the other major bump (3/7 -> 11): its only users (xcode, @expo/ngrok,
# both build tooling) call uuid.v4(), which uuid 11 still ships as CommonJS.
# decode-uri-component uses a CommonJS compatibility patch for query-string.
# Expo Metro 0.83.3 is patched to pass file contents to image-size 2.0.4.
# node-forge, braces and sprintf-js still have no patched release.
overrides:
  # Pinned to the version Expo SDK 54 expects (from chore/wallet-engine-beta69).
  expo-constants: 18.0.14
  tar@7: ^7.5.21
  '@grpc/grpc-js@1': ^1.14.5
  '@xmldom/xmldom@0.8': ^0.8.15
  '@xmldom/xmldom@0.9': ^0.9.12
  brace-expansion@1: ^1.1.21
  brace-expansion@2: ^2.1.7
  brace-expansion@5: ^5.0.12
  browserslist@4: ^4.28.7
  baseline-browser-mapping@2: ^2.11.0
  fast-uri@3: ^3.1.8
  js-yaml@3: ^3.15.2
  js-yaml@4: ^4.3.2
  nanoid@3: ^3.3.18
  postcss@8: ^8.5.23
  shell-quote@1: ^1.9.0
  undici@6: ^6.28.1
  ip-address@10: ^10.7.1
  protobufjs@7: ^7.6.5
  markdown-it: ^14.3.1
  uuid@<11.1.1: ^11.1.1
  http-cache-semantics@4: ^4.3.0
  source-map-js@1: ^1.2.2
  compression@1: ^1.8.2
  decode-uri-component: 0.5.0
  image-size: 2.0.4

# Bark pays BOLT12 offers (payLightningOffer); remove once wallet-engine ships it.
patchedDependencies:
  # Addon frameworks declare iOS 15.0 like their binaries (bare-link 3 wrote
  # 14.0, which App Store Connect rejects with ITMS-90208; fixed in bare-link 4).
  bare-link@3.2.2: patches/bare-link@3.2.2.patch
  '@kaleidorg/wallet-engine@1.0.0-beta.75': patches/@kaleidorg__wallet-engine@1.0.0-beta.75.patch
  decode-uri-component@0.5.0: patches/decode-uri-component@0.5.0.patch
  metro@0.83.3: patches/metro@0.83.3.patch
  # RGB on this phone keeps each extra network's wallet in a folder of its own.
  react-native-rgb@0.2.4: patches/react-native-rgb@0.2.4.patch

# Bark downloads checksum-verified native binaries during installation.
onlyBuiltDependencies:
  - '@secondts/bark-react-native'
  # Downloads rgb-lib's iOS xcframework (macOS only) for RGB on this phone.
  - react-native-rgb
