name: CI

# Fast checks on every pull request: type-check and unit tests. Release builds
# live in release.yml; this workflow never builds native code or signs anything.
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

# A newer push to the same PR/branch supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Type-check & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # KaleidoPay imports packages from the sibling kaleidoswap/kaleido-pay
      # checkout (see services/kaleidoPay/README.md).
      # Payment code from kaleido-pay is pinned to the commit in kaleido-pay.ref.
      - name: Read pinned kaleido-pay commit
        id: kaleido-pay
        run: echo "ref=$(tr -d '[:space:]' < kaleido-pay.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: kaleidoswap/kaleido-pay
          ref: ${{ steps.kaleido-pay.outputs.ref }}
          path: universal-bolt12
      - name: Place universal-bolt12 beside the app
        run: mv universal-bolt12 ../universal-bolt12 && (cd ../universal-bolt12 && npm ci --ignore-scripts)

      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      # --frozen-lockfile fails the run if pnpm-lock.yaml drifts from
      # package.json (the release workflow installs the same way).
      # --ignore-scripts skips postinstall, which downloads native Bark/QVAC
      # artifacts that type-checking and Jest don't need.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Published Mind dependency isolation
        run: node --test scripts/sync-mind.test.cjs

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Dependency security regressions
        run: pnpm test:dependency-security

      - name: Native image asset formats
        run: node --test scripts/image-assets.test.cjs scripts/check-release-dependencies.test.cjs

      - name: Unit tests (with the coverage floor from jest.config.js)
        run: pnpm exec jest --ci --coverage --coverageReporters=text-summary

  # Builds the production JS bundle the release apps ship (Metro + Babel),
  # catching resolution/transform breakage that tsc and Jest can't see, e.g. a
  # dependency bump Metro can't load or a missing sibling package.
  bundle:
    name: Production bundle (${{ matrix.platform }})
    strategy:
      matrix:
        platform: [android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Same sibling checkout as the checks job.
      # Payment code from kaleido-pay is pinned to the commit in kaleido-pay.ref.
      - name: Read pinned kaleido-pay commit
        id: kaleido-pay
        run: echo "ref=$(tr -d '[:space:]' < kaleido-pay.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: kaleidoswap/kaleido-pay
          ref: ${{ steps.kaleido-pay.outputs.ref }}
          path: universal-bolt12
      - name: Place universal-bolt12 beside the app
        run: mv universal-bolt12 ../universal-bolt12 && (cd ../universal-bolt12 && npm ci --ignore-scripts)

      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # NODE_ENV=production also runs the console-stripping Babel plugin.
      - name: Export production bundle
        run: pnpm exec expo export --platform ${{ matrix.platform }} --source-maps --output-dir "$RUNNER_TEMP/bundle"
        env:
          NODE_ENV: production

      - name: Verify unpatched tooling dependencies stay out of the app
        run: node scripts/check-release-dependencies.cjs "$RUNNER_TEMP/bundle"
