name: BFA native test builds

on:
  push:
    branches: [test/rgb-bfa8-native]
  workflow_call:
    inputs:
      android_version:
        type: string
        required: true
      ios_version:
        type: string
        required: true
      build_code:
        type: string
        required: true
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: rate-rgb-bfa-native-test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  EXPO_PUBLIC_CHANNEL: dev
  EXPO_PUBLIC_BARK: '0'
  EXPO_PUBLIC_WDK_ARKADE: '0'
  EXPO_NO_TELEMETRY: '1'
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  android:
    name: Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free build disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned kaleido-pay commit
        id: kaleido-pay
        run: echo "ref=$(tr -d '[:space:]' < kaleido-pay.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: kaleidoswap/kaleido-pay
          ref: ${{ steps.kaleido-pay.outputs.ref }}
          path: universal-bolt12
      - name: Set up sibling package
        run: mv universal-bolt12 ../universal-bolt12 && (cd ../universal-bolt12 && npm ci --ignore-scripts)
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install pinned NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build debug-signed test APK
        if: ${{ !inputs.android_version }}
        working-directory: android
        run: ./gradlew :app:assembleBfaTest --no-daemon
      - name: Set the Android preview manifest version
        if: ${{ inputs.android_version }}
        env:
          PREVIEW_VERSION: ${{ inputs.android_version }}
          BUILD_CODE: ${{ inputs.build_code }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const app = require('./app.json');
          app.expo.version = process.env.PREVIEW_VERSION;
          app.expo.android.versionCode = Number(process.env.BUILD_CODE);
          app.expo.ios.buildNumber = process.env.BUILD_CODE;
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          NODE
      - name: Prepare preview signing and expected certificate
        if: ${{ inputs.android_version }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          umask 077
          keystore="$RUNNER_TEMP/bfa-preview-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          certificate="$(keytool -exportcert -keystore "$keystore" -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD | sha256sum | cut -d' ' -f1)"
          printf 'BFA_PREVIEW_CERTIFICATE_SHA256=%s\n' "$certificate" >> "$GITHUB_ENV"
      - name: Build preview APK
        if: ${{ inputs.android_version }}
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ inputs.android_version }}
          ORG_GRADLE_PROJECT_VERSION_CODE: ${{ inputs.build_code }}
        run: ./gradlew :app:assembleBfaTest --no-daemon
      - name: Sign the preview APK with the release key
        if: ${{ inputs.android_version }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apks=(android/app/build/outputs/apk/bfaTest/*.apk)
          test "${#apks[@]}" = 1
          test -n "$ANDROID_KEY_PASSWORD"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$apksigner" sign --ks "$RUNNER_TEMP/bfa-preview-release.p12" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --v4-signing-enabled false --out "$RUNNER_TEMP/rate-bfa8-signed.apk" "${apks[0]}"
      - name: Remove preview signing key
        if: ${{ always() && inputs.android_version }}
        run: rm -f "$RUNNER_TEMP/bfa-preview-release.p12"
      - name: Check app identity, version and BFA library
        env:
          PREVIEW_VERSION: ${{ inputs.android_version }}
          BUILD_CODE: ${{ inputs.build_code }}
        run: |
          set -euo pipefail
          apks=(android/app/build/outputs/apk/bfaTest/*.apk)
          test "${#apks[@]}" = 1
          apk="${apks[0]}"
          if [[ -n "$PREVIEW_VERSION" ]]; then
            apk="$RUNNER_TEMP/rate-bfa8-signed.apk"
          fi
          aapt="$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt -type f | sort -V | tail -n1)"
          badging="$("$aapt" dump badging "$apk" | sed -n '1p')"
          printf '%s\n' "$badging" | grep "^package: name='com.kaleidoswap.wallet.bfatest' "
          if [[ -n "$PREVIEW_VERSION" ]]; then
            printf '%s\n' "$badging" | grep -F "versionName='$PREVIEW_VERSION'"
            printf '%s\n' "$badging" | grep -F "versionCode='$BUILD_CODE'"
            apksigner="$(dirname "$aapt")/apksigner"
            certificates="$("$apksigner" verify --print-certs "$apk" |
              LC_ALL=C sed -nE '/^(V[0-9][0-9.]* Signer|Signer #|Signer \()/s/^.* certificate SHA-256 digest: ([[:xdigit:]]{64})[[:space:]]*$/\1/p' |
              tr '[:upper:]' '[:lower:]' | LC_ALL=C sort -u)"
            if [[ -z "$BFA_PREVIEW_CERTIFICATE_SHA256" || "$certificates" != "$BFA_PREVIEW_CERTIFICATE_SHA256" ]]; then
              echo "::error::The APK signer does not match the release certificate."
              exit 1
            fi
          fi
          python - "$apk" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              members = set(apk.namelist())
              assert 'lib/arm64-v8a/librgblibuniffi.so' in members
              assert 'assets/index.android.bundle' in members
          PY
          cp "$apk" "$RUNNER_TEMP/rate-bfa8-test.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: rate-bfa8-android
          path: ${{ runner.temp }}/rate-bfa8-test.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS Simulator test app
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned kaleido-pay commit
        id: kaleido-pay
        run: echo "ref=$(tr -d '[:space:]' < kaleido-pay.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: kaleidoswap/kaleido-pay
          ref: ${{ steps.kaleido-pay.outputs.ref }}
          path: universal-bolt12
      - name: Set up sibling package
        run: mv universal-bolt12 ../universal-bolt12 && (cd ../universal-bolt12 && npm ci --ignore-scripts)
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - name: Install dependencies and native addons
        run: |
          pnpm install --frozen-lockfile
          node scripts/patch-bare-kit-linker.js
          node node_modules/react-native-bare-kit/ios/link.mjs
      - name: Install Pods
        working-directory: ios
        run: pod install
      - name: Set the preview simulator version
        if: ${{ inputs.ios_version }}
        working-directory: ios
        env:
          PREVIEW_VERSION: ${{ inputs.ios_version }}
          BUILD_CODE: ${{ inputs.build_code }}
        run: |
          agvtool new-marketing-version "$PREVIEW_VERSION"
          agvtool new-version -all "$BUILD_CODE"
          node <<'NODE'
          const fs = require('node:fs');
          const app = require('../app.json');
          app.expo.version = process.env.PREVIEW_VERSION;
          app.expo.ios.buildNumber = process.env.BUILD_CODE;
          fs.writeFileSync('../app.json', JSON.stringify(app, null, 2) + '\n');
          NODE
      - name: Build simulator app
        run: |
          xcodebuild build -quiet \
            -workspace ios/KaleidoSwap.xcworkspace -scheme KaleidoSwap \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/rate-bfa-ios" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
      - name: Check app identity and archive simulator bundle
        env:
          PREVIEW_VERSION: ${{ inputs.ios_version }}
          BUILD_CODE: ${{ inputs.build_code }}
        run: |
          app="$RUNNER_TEMP/rate-bfa-ios/Build/Products/Release-iphonesimulator/KaleidoSwap.app"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Info.plist")" = com.kaleidoswap.wallet.bfatest
          if [[ -n "$PREVIEW_VERSION" ]]; then
            test "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Info.plist")" = "$PREVIEW_VERSION"
            test "$(plutil -extract CFBundleVersion raw -o - "$app/Info.plist")" = "$BUILD_CODE"
          fi
          test -s "$app/main.jsbundle"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/rate-bfa8-simulator.zip"
      - name: Verify WASM invoice, BFA wallet reopen and encrypted restore offline
        timeout-minutes: 10
        run: |
          simulator="$(xcrun simctl list devices available -j | jq -er \
            '[.devices[][] | select(.isAvailable and (.name | startswith("iPhone"))) | .udid] | last')"
          xcrun simctl boot "$simulator" || true
          xcrun simctl bootstatus "$simulator" -b
          echo "SIMULATOR_UDID=$simulator" >> "$GITHUB_ENV"
          SIMULATOR_UDID="$simulator" bash scripts/bfa-e2e/run-ios.sh
      - name: Launch the isolated simulator build
        run: |
          app="$RUNNER_TEMP/rate-bfa-ios/Build/Products/Release-iphonesimulator/KaleidoSwap.app"
          xcrun simctl install "$SIMULATOR_UDID" "$app"
          xcrun simctl launch "$SIMULATOR_UDID" com.kaleidoswap.wallet.bfatest
      - uses: actions/upload-artifact@v4
        with:
          name: rate-bfa8-ios-simulator
          path: ${{ runner.temp }}/rate-bfa8-simulator.zip
          if-no-files-found: error
          retention-days: 14
