name: Release

# Cut a release on a version tag:
#   git tag v1.2.0 && git push origin v1.2.0
#     → Android: signed APK, attached to a GitHub Release
#     → iOS:     archived, signed, and uploaded to TestFlight
#
# Versioning is derived, never committed back:
#   - marketing version (versionName / CFBundleShortVersionString) = tag minus 'v'
#   - build number      (versionCode  / CFBundleVersion)           = commit count
# Commit count is monotonic and already well above the current TestFlight build,
# so build numbers always increase without a commit-back step.
#
# workflow_dispatch with dry_run=true builds + signs both platforms but skips
# the TestFlight upload and the GitHub Release — a safe end-to-end smoke test.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build & sign both platforms but skip TestFlight upload + GitHub Release'
        type: boolean
        default: true

# Never run two releases for the same ref at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Inlined into the JS bundle at build time. The Flashnet Orchestra client key
# (fnp_*) is public by design; without it, cross-chain deposit and send are off.
env:
  EXPO_PUBLIC_FLASHNET_ORCHESTRA_KEY: ${{ vars.FLASHNET_ORCHESTRA_KEY }}

jobs:
  # ---------------------------------------------------------------------------
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — versionCode = commit count
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="0.0.0-${GITHUB_SHA::7}"   # dry-run / manual dispatch
          fi
          CODE="$(git rev-list --count HEAD)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version=$NAME ($CODE)" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: version
    steps:
      # The jniLib merge is disk-hungry; reclaim space from preinstalled tooling
      # we don't use (≈15 GB) so the runner doesn't run out mid-build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk || true
          df -h / | tail -1

      - uses: actions/checkout@v4

      # KaleidoPay imports packages from the sibling kaleidoswap/kaleido-pay
      # checkout (see services/kaleidoPay/README.md); without it Metro can't
      # resolve them and the release bundle fails.
      # Payment code from kaleido-pay is pinned to the commit in kaleido-pay.ref.
      - name: Read pinned kaleido-pay commit
        id: kaleido-pay
        run: echo "ref=$(tr -d '[:space:]' < kaleido-pay.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: kaleidoswap/kaleido-pay
          ref: ${{ steps.kaleido-pay.outputs.ref }}
          path: universal-bolt12
      - name: Place universal-bolt12 beside the app
        run: mv universal-bolt12 ../universal-bolt12 && (cd ../universal-bolt12 && npm ci --ignore-scripts)

      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      # Pinned NDK isn't preinstalled on the runner — install it for .so stripping.
      - name: Install NDK 29.0.14206865
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null

      # Runs postinstall (Bark native artifacts, QVAC addon linking).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Firebase config for FCM push. Optional: without it the APK builds without push.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is not set: the APK has no push notifications."
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          grep -q '"com.kaleidoswap.wallet"' android/app/google-services.json \
            || { echo "::error::google-services.json has no Android app for com.kaleidoswap.wallet"; exit 1; }

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build release APK
        working-directory: android
        env:
          # ORG_GRADLE_PROJECT_* → Gradle project properties (read by build.gradle).
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ runner.temp }}/release.p12
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ needs.version.outputs.name }}
          ORG_GRADLE_PROJECT_VERSION_CODE: ${{ needs.version.outputs.code }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        env:
          VERSION_NAME: ${{ needs.version.outputs.name }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/kaleidoswap-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  ios:
    name: iOS TestFlight
    runs-on: macos-15
    needs: version
    steps:
      - uses: actions/checkout@v4

      # KaleidoPay imports packages from the sibling kaleidoswap/kaleido-pay
      # checkout (see services/kaleidoPay/README.md); without it Metro can't
      # resolve them and the release bundle fails.
      # Payment code from kaleido-pay is pinned to the commit in kaleido-pay.ref.
      - name: Read pinned kaleido-pay commit
        id: kaleido-pay
        run: echo "ref=$(tr -d '[:space:]' < kaleido-pay.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: kaleidoswap/kaleido-pay
          ref: ${{ steps.kaleido-pay.outputs.ref }}
          path: universal-bolt12
      - name: Place universal-bolt12 beside the app
        run: mv universal-bolt12 ../universal-bolt12 && (cd ../universal-bolt12 && npm ci --ignore-scripts)

      # React Native requires Xcode >= 16.1; pin the newest stable Xcode on the
      # runner rather than relying on the image default.
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }

      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"

      # Saved signing identities for every build. Without them, automatic signing
      # on a fresh runner asks Apple for new certificates on each run until the
      # account hits its certificate limit (the v0.3.1 failure). With them, Xcode
      # reuses these certificates and only creates provisioning profiles.
      # The .p12 should hold the "Apple Development" AND "Apple Distribution"
      # identities (archive signs for development, export for the App Store).
      # Optional: without the secrets the build falls back to the old behaviour.
      - name: Import signing certificates
        env:
          IOS_SIGNING_P12_BASE64: ${{ secrets.IOS_SIGNING_P12_BASE64 }}
          IOS_SIGNING_P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$IOS_SIGNING_P12_BASE64" ]; then
            echo "::warning::IOS_SIGNING_P12_BASE64 is not set: signing will create new certificates with Apple on every build."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          P12="$RUNNER_TEMP/signing.p12"
          echo "$IOS_SIGNING_P12_BASE64" | base64 -d > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -P "$IOS_SIGNING_P12_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN"
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Search the signing keychain first, keep the login keychain for the rest.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN")"
          echo "$IDENTITIES" | sed -E 's/[0-9A-F]{40}/<sha1>/'
          echo "$IDENTITIES" | grep -q "Apple Distribution" || echo "::warning::No Apple Distribution identity in the .p12: the App Store export will create one with Apple."
          echo "$IDENTITIES" | grep -q "Apple Development" || echo "::warning::No Apple Development identity in the .p12: the archive will create one with Apple."

      - name: Set version + build number
        working-directory: ios
        env:
          VERSION_NAME: ${{ needs.version.outputs.name }}
          VERSION_CODE: ${{ needs.version.outputs.code }}
        run: |
          agvtool new-marketing-version "$VERSION_NAME"
          agvtool new-version -all "$VERSION_CODE"

      - name: Archive, sign & upload to TestFlight
        env:
          ASC_KEY_P8: ${{ runner.temp }}/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SKIP_BUMP: '1'   # version already set above
          SKIP_UPLOAD: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: bash scripts/testflight.sh

  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [version, android, ios]
    # Only on a real tag push — never on a dry-run dispatch.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.apk
          body: |
            ### Downloads
            - **Android**: the signed `.apk` attached below (sideload).
            - **iOS**: shipped to TestFlight — https://testflight.apple.com/join/ddrZT98T

            Build `${{ needs.version.outputs.name }}` (${{ needs.version.outputs.code }}).
