name: Release

# Cut a release on a version tag:
#   git tag v1.2.0 && git push origin v1.2.0
#     → Android: signed APK, attached to a GitHub Release
#     → iOS:     archived, signed, and uploaded to TestFlight
#
# Versioning is derived, never committed back:
#   - marketing version (versionName / CFBundleShortVersionString) = tag minus 'v'
#   - build number      (versionCode  / CFBundleVersion)           = commit count
# Commit count is monotonic and already well above the current TestFlight build,
# so build numbers always increase without a commit-back step.
#
# workflow_dispatch with dry_run=true builds + signs both platforms but skips
# the TestFlight upload and the GitHub Release — a safe end-to-end smoke test.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build & sign both platforms but skip TestFlight upload + GitHub Release'
        type: boolean
        default: true

# Never run two releases for the same ref at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — versionCode = commit count
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="0.0.0-${GITHUB_SHA::7}"   # dry-run / manual dispatch
          fi
          CODE="$(git rev-list --count HEAD)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version=$NAME ($CODE)" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: version
    steps:
      # The jniLib merge is disk-hungry; reclaim space from preinstalled tooling
      # we don't use (≈15 GB) so the runner doesn't run out mid-build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk || true
          df -h / | tail -1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      # Pinned NDK isn't preinstalled on the runner — install it for .so stripping.
      - name: Install NDK 29.0.14206865
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null

      # Runs postinstall (fetch-lwk-artifacts pulls the Android jniLibs).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The app ships arm64-v8a only (ndk.abiFilters). lwk-rn bundles 606 MB of
      # static libs across 4 ABIs — drop the unused 3 so lwk-rn's source-set
      # merge (:lwk-rn:mergeReleaseJniLibFolders) stays within the runner disk.
      # This is a BUILD-TIME disk concern only and is distinct from the APK-size
      # exclude in android/app/build.gradle: the kept arm64-v8a liblwk.a is still
      # needed here so CMake can link it into the runtime .so, but it (and any
      # other static archive) is then excluded from the final APK by
      # packagingOptions.jniLibs.excludes. The merge runs upstream of packaging,
      # so that exclude cannot replace this trim. The final APK is identical
      # (other ABIs are filtered out anyway).
      - name: Trim native libs to arm64-v8a
        run: rm -rf node_modules/lwk-rn/android/src/main/jniLibs/x86 node_modules/lwk-rn/android/src/main/jniLibs/x86_64 node_modules/lwk-rn/android/src/main/jniLibs/armeabi-v7a

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build release APK
        working-directory: android
        env:
          # ORG_GRADLE_PROJECT_* → Gradle project properties (read by build.gradle).
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ runner.temp }}/release.p12
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ needs.version.outputs.name }}
          ORG_GRADLE_PROJECT_VERSION_CODE: ${{ needs.version.outputs.code }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        env:
          VERSION_NAME: ${{ needs.version.outputs.name }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/kaleidoswap-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  ios:
    name: iOS TestFlight
    runs-on: macos-15
    needs: version
    steps:
      - uses: actions/checkout@v4

      # React Native requires Xcode >= 16.1; pin the newest stable Xcode on the
      # runner rather than relying on the image default.
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }

      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"

      - name: Set version + build number
        working-directory: ios
        env:
          VERSION_NAME: ${{ needs.version.outputs.name }}
          VERSION_CODE: ${{ needs.version.outputs.code }}
        run: |
          agvtool new-marketing-version "$VERSION_NAME"
          agvtool new-version -all "$VERSION_CODE"

      - name: Archive, sign & upload to TestFlight
        env:
          ASC_KEY_P8: ${{ runner.temp }}/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SKIP_BUMP: '1'   # version already set above
          SKIP_UPLOAD: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: bash scripts/testflight.sh

  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [version, android, ios]
    # Only on a real tag push — never on a dry-run dispatch.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.apk
          body: |
            ### Downloads
            - **Android**: the signed `.apk` attached below (sideload).
            - **iOS**: shipped to TestFlight — https://testflight.apple.com/join/ddrZT98T

            Build `${{ needs.version.outputs.name }}` (${{ needs.version.outputs.code }}).
