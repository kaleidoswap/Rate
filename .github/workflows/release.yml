name: Release

# Cut a release on a version tag:
#   git tag v1.2.0 && git push origin v1.2.0
#     → Android: signed APK, attached to a GitHub Release
#     → iOS:     archived, signed, and uploaded to TestFlight
#
# Versioning is derived, never committed back:
#   - marketing version (versionName / CFBundleShortVersionString) = tag minus 'v'
#   - build number      (versionCode  / CFBundleVersion)           = commit count
# Commit count is monotonic and already well above the current TestFlight build,
# so build numbers always increase without a commit-back step.
#
# workflow_dispatch with dry_run=true builds + signs both platforms but skips
# the TestFlight upload and the GitHub Release — a safe end-to-end smoke test.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build & sign both platforms but skip TestFlight upload + GitHub Release'
        type: boolean
        default: true
      marketing_version:
        description: 'Optional marketing version for a branch build, e.g. 0.20.0'
        type: string
        required: false
      android_shrink:
        description: 'Build only Android with R8 and resource shrinking for comparison (dry run)'
        type: boolean
        default: false

# Never run two releases for the same ref at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Inlined into the JS bundle at build time. The Flashnet Orchestra client key
# (fnp_*) is public by design; without it, cross-chain deposit and send are off.
# EXPO_PUBLIC_CHANNEL (dev | beta | store) sets which features the build ships
# (services/features.ts) and comes from the APP_CHANNEL repo variable: a tag or
# an uploading run needs beta or store; only a dry run may build dev.
env:
  EXPO_PUBLIC_FLASHNET_ORCHESTRA_KEY: ${{ vars.FLASHNET_ORCHESTRA_KEY }}
  EXPO_PUBLIC_CHANNEL: ${{ vars.APP_CHANNEL }}
  # Sentry DSN (public by design). Without it the app has no crash reporting
  # and Settings hides the opt-in switch.
  EXPO_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
  EXPO_PUBLIC_RGB_L1_MUTINYNET_EVM_CHAINS: ${{ vars.RGB_L1_MUTINYNET_EVM_CHAINS }}
  # Utexo's public Bitcoin Signet bridge settles via Arbitrum One.
  EXPO_PUBLIC_RGB_L1_SIGNET_EVM_CHAINS: >-
    ${{ vars.RGB_L1_SIGNET_EVM_CHAINS || '{"42161":{"rpcUrl":"https://arb1.arbitrum.io/rpc","minMintLockBlocks":1200,"maxMintLockBlocks":28800}}' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - name: Check release channel
        env:
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
          ANDROID_SHRINK: ${{ (github.event_name == 'workflow_dispatch' && inputs.android_shrink) && '1' || '0' }}
        run: |
          if [ "$ANDROID_SHRINK" = "1" ] && [ "$DRY_RUN" != "1" ]; then
            echo '::error::Android shrinking can only be enabled in a dry run.'
            exit 1
          fi
          case "$EXPO_PUBLIC_CHANNEL" in
            beta|store) ;;
            dev)
              if [ "$DRY_RUN" != "1" ]; then
                echo "::error::APP_CHANNEL=dev is only allowed for dry runs"
                exit 1
              fi ;;
            *)
              echo "::error::APP_CHANNEL must be beta or store (dev for dry runs), got '$EXPO_PUBLIC_CHANNEL'"
              exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0   # full history — versionCode = commit count
      - id: v
        env:
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          elif [ -n "$MARKETING_VERSION" ]; then
            if ! [[ "$MARKETING_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo '::error::Enter a marketing version in major.minor.patch format.'
              exit 1
            fi
            NAME="$MARKETING_VERSION"
          else
            NAME="0.0.0-${GITHUB_SHA::7}"   # dry-run / manual dispatch
          fi
          CODE="$(git rev-list --count HEAD)"
          APP_BUILD="$(node -p "require('./app.json').expo.ios.buildNumber")"
          if [ "$APP_BUILD" -gt "$CODE" ]; then CODE="$APP_BUILD"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version=$NAME ($CODE)" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: version
    steps:
      # The jniLib merge is disk-hungry; reclaim space from preinstalled tooling
      # we don't use (≈15 GB) so the runner doesn't run out mid-build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk || true
          df -h / | tail -1

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # KaleidoPay imports packages from the sibling kaleidoswap/kaleido-pay
      # checkout (see services/kaleidoPay/README.md); without it Metro can't
      # resolve them and the release bundle fails.
      # Payment code from kaleido-pay is pinned to the commit in kaleido-pay.ref.
      - name: Read pinned kaleido-pay commit
        id: kaleido-pay
        run: echo "ref=$(tr -d '[:space:]' < kaleido-pay.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: kaleidoswap/kaleido-pay
          ref: ${{ steps.kaleido-pay.outputs.ref }}
          path: universal-bolt12
      - name: Place universal-bolt12 beside the app
        run: mv universal-bolt12 ../universal-bolt12 && (cd ../universal-bolt12 && npm ci --ignore-scripts)

      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      # Pinned NDK isn't preinstalled on the runner — install it for .so stripping.
      - name: Install NDK 29.0.14206865
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null

      # Runs postinstall (Bark native artifacts, QVAC addon linking).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Firebase config for FCM push. Optional: without it the APK builds without push.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is not set: the APK has no push notifications."
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          grep -q '"com.kaleidoswap.wallet"' android/app/google-services.json \
            || { echo "::error::google-services.json has no Android app for com.kaleidoswap.wallet"; exit 1; }

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build release APK
        working-directory: android
        env:
          # ORG_GRADLE_PROJECT_* → Gradle project properties (read by build.gradle).
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ runner.temp }}/release.p12
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ needs.version.outputs.name }}
          ORG_GRADLE_PROJECT_VERSION_CODE: ${{ needs.version.outputs.code }}
          ANDROID_SHRINK: ${{ (github.event_name == 'workflow_dispatch' && inputs.android_shrink) && '1' || '0' }}
        run: |
          # For this sideloaded APK the Android passkey origin is its release signer.
          keytool -exportcert -keystore "$ORG_GRADLE_PROJECT_RELEASE_STORE_FILE" \
            -storepass:env ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD \
            -alias "$ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS" -file "$RUNNER_TEMP/apk-signer.der"
          signer_digest="$(sha256sum "$RUNNER_TEMP/apk-signer.der")"
          export EXPO_PUBLIC_PASSKEY_ANDROID_CERT_SHA256="${signer_digest%% *}"
          flags=()
          if [ "$ANDROID_SHRINK" = "1" ]; then
            flags+=(-Pandroid.enableMinifyInReleaseBuilds=true -Pandroid.enableShrinkResourcesInReleaseBuilds=true)
          fi
          ./gradlew :app:assembleRelease --no-daemon "${flags[@]}"

      - name: Rename APK
        env:
          VERSION_NAME: ${{ needs.version.outputs.name }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/kaleidoswap-${VERSION_NAME}.apk"

      - name: Report APK size
        run: python3 scripts/report-apk-size.py dist/*.apk | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  ios:
    name: iOS TestFlight
    runs-on: macos-15
    needs: version
    if: github.event_name != 'workflow_dispatch' || !inputs.android_shrink
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # KaleidoPay imports packages from the sibling kaleidoswap/kaleido-pay
      # checkout (see services/kaleidoPay/README.md); without it Metro can't
      # resolve them and the release bundle fails.
      # Payment code from kaleido-pay is pinned to the commit in kaleido-pay.ref.
      - name: Read pinned kaleido-pay commit
        id: kaleido-pay
        run: echo "ref=$(tr -d '[:space:]' < kaleido-pay.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: kaleidoswap/kaleido-pay
          ref: ${{ steps.kaleido-pay.outputs.ref }}
          path: universal-bolt12
      - name: Place universal-bolt12 beside the app
        run: mv universal-bolt12 ../universal-bolt12 && (cd ../universal-bolt12 && npm ci --ignore-scripts)

      # React Native requires Xcode >= 16.1; pin the newest stable Xcode on the
      # runner rather than relying on the image default.
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }

      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"

      # Saved signing identities for every build. Without them, automatic signing
      # on a fresh runner asks Apple for new certificates on each run until the
      # account hits its certificate limit (the v0.3.1 failure). With them, Xcode
      # reuses these certificates and only creates provisioning profiles.
      # The .p12 should hold the "Apple Development" AND "Apple Distribution"
      # identities (archive signs for development, export for the App Store).
      # Optional: without the secrets the build falls back to the old behaviour.
      - name: Import signing certificates
        env:
          IOS_SIGNING_P12_BASE64: ${{ secrets.IOS_SIGNING_P12_BASE64 }}
          IOS_SIGNING_P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$IOS_SIGNING_P12_BASE64" ]; then
            echo "::warning::IOS_SIGNING_P12_BASE64 is not set: signing will create new certificates with Apple on every build."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          P12="$RUNNER_TEMP/signing.p12"
          echo "$IOS_SIGNING_P12_BASE64" | base64 -d > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -P "$IOS_SIGNING_P12_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN"
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Search the signing keychain first, keep the login keychain for the rest.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN")"
          echo "$IDENTITIES" | sed -E 's/[0-9A-F]{40}/<sha1>/'
          echo "$IDENTITIES" | grep -q "Apple Distribution" || echo "::warning::No Apple Distribution identity in the .p12: the App Store export will create one with Apple."
          echo "$IDENTITIES" | grep -q "Apple Development" || echo "::warning::No Apple Development identity in the .p12: the archive will create one with Apple."

      - name: Set version + build number
        working-directory: ios
        env:
          VERSION_NAME: ${{ needs.version.outputs.name }}
          VERSION_CODE: ${{ needs.version.outputs.code }}
        run: |
          agvtool new-marketing-version "$VERSION_NAME"
          agvtool new-version -all "$VERSION_CODE"
          node -e 'const fs=require("fs"); const p="../app.json"; const a=JSON.parse(fs.readFileSync(p,"utf8")); a.expo.version=process.env.VERSION_NAME; a.expo.ios.buildNumber=process.env.VERSION_CODE; fs.writeFileSync(p,JSON.stringify(a,null,2)+"\n");'

      - name: Archive, sign & upload to TestFlight
        env:
          ASC_KEY_P8: ${{ runner.temp }}/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SKIP_BUMP: '1'   # version already set above
          SKIP_UPLOAD: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: bash scripts/testflight.sh

  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [version, android, ios]
    # Only on a real tag push — never on a dry-run dispatch. An Apple-side
    # failure (signing, membership) must not hold back the Android APK.
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.version.result == 'success' && needs.android.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.apk
          body: |
            ### Downloads
            - **Android**: the signed `.apk` attached below (sideload).
            - **iOS**: ${{ needs.ios.result == 'success' && 'shipped to TestFlight — https://testflight.apple.com/join/ddrZT98T' || 'not in this release: the iOS build failed, see the workflow run' }}

            Build `${{ needs.version.outputs.name }}` (${{ needs.version.outputs.code }}).
