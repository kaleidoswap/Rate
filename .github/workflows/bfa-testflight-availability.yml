name: Prepare Rate BFA TestFlight identifier

on:
  push:
    branches: [release/bfa-preview]
    paths: [.github/workflows/bfa-testflight-availability.yml]

permissions: {}

jobs:
  check:
    name: Prepare the isolated iOS identifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Register the Rate BFA Test Bundle ID and check its app record
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { createPrivateKey, sign } from 'node:crypto';
          import { appendFileSync } from 'node:fs';

          const { ASC_KEY_P8_BASE64, ASC_KEY_ID, ASC_ISSUER_ID } = process.env;
          if (!ASC_KEY_P8_BASE64 || !ASC_KEY_ID || !ASC_ISSUER_ID) {
            throw new Error('App Store Connect credentials are unavailable in this workflow.');
          }
          const encode = (value) => Buffer.from(JSON.stringify(value)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const header = encode({ alg: 'ES256', kid: ASC_KEY_ID, typ: 'JWT' });
          const payload = encode({ iss: ASC_ISSUER_ID, iat: now, exp: now + 300, aud: 'appstoreconnect-v1' });
          const signingInput = header + '.' + payload;
          const key = createPrivateKey(Buffer.from(ASC_KEY_P8_BASE64, 'base64'));
          const signature = sign('sha256', Buffer.from(signingInput), { key, dsaEncoding: 'ieee-p1363' });
          const bundleId = 'com.kaleidoswap.wallet.bfatest';
          const authorization = 'Bearer ' + signingInput + '.' + signature.toString('base64url');
          async function request(resource, query = {}, body) {
            const url = new URL('/v1/' + resource, 'https://api.appstoreconnect.apple.com');
            url.search = new URLSearchParams(query);
            return fetch(url, {
              method: body ? 'POST' : 'GET',
              headers: { Authorization: authorization, ...(body ? { 'Content-Type': 'application/json' } : {}) },
              body: body ? JSON.stringify(body) : undefined,
              redirect: 'error',
              signal: AbortSignal.timeout(20_000),
            });
          }
          async function hasIdentifier() {
            const response = await request('bundleIds', { 'filter[identifier]': bundleId, limit: '1' });
            if (!response.ok) throw new Error('Bundle ID lookup returned HTTP ' + response.status);
            const { data } = await response.json();
            return data.some(({ attributes }) => attributes?.identifier === bundleId);
          }

          let identifierStatus = 'The isolated Bundle ID is already registered.';
          if (!(await hasIdentifier())) {
            const response = await request('bundleIds', {}, {
              data: {
                type: 'bundleIds',
                attributes: { identifier: bundleId, name: 'Rate BFA Test', platform: 'IOS' },
              },
            });
            if (response.ok) {
              identifierStatus = 'Registered the isolated iOS Bundle ID.';
            } else if (response.status !== 409 || !(await hasIdentifier())) {
              throw new Error('Bundle ID registration returned HTTP ' + response.status);
            }
          }
          console.log(identifierStatus);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, identifierStatus + '\n');

          const apps = await request('apps', { 'filter[bundleId]': bundleId, 'fields[apps]': 'bundleId', limit: '1' });
          if (!apps.ok) throw new Error('App Store Connect lookup returned HTTP ' + apps.status);
          const { data } = await apps.json();
          const summary = data.some(({ attributes }) => attributes?.bundleId === bundleId)
            ? 'The isolated bundle identifier has a record accessible to the release key.'
            : 'The release key found no app record for the isolated bundle identifier.';
          console.log(summary);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          NODE
