<script>
(()=>{
const root=document.getElementById('rate-review'),content=root.querySelector('#rr-content'),picker=root.querySelector('#rr-screen');
const state={screen:'home',account:'Spark',amount:12500,recipient:'Alice',address:'alice@example.com',cancelled:false,removed:false};
const money=n=>n.toLocaleString('en-US');
function render(name){
 const template=root.querySelector('#rr-'+name);if(!template||template.tagName!=='TEMPLATE')return;
 state.screen=name;picker.value=name;content.replaceChildren(template.content.cloneNode(true));
 const fee=state.account==='Spark'?2:18;
 const set=(selector,value)=>content.querySelectorAll(selector).forEach(el=>el.textContent=value);
 set('[data-account]',state.account);set('[data-account-balance]',(state.account==='Spark'?'510,000':'335,200')+' sats available');set('[data-recipient]',state.recipient);set('[data-address]',state.address);set('[data-amount]',money(state.amount));set('[data-fee]',fee+' sats');set('[data-total]',money(state.amount+fee)+' sats');
 content.querySelectorAll('[data-option-total]').forEach(el=>el.textContent=money(state.amount+Number(el.dataset.optionTotal))+' sats');
 content.querySelectorAll('[data-pick]').forEach(el=>{el.classList.toggle('rr-selected',el.dataset.pick===state.account);el.setAttribute('aria-pressed',String(el.dataset.pick===state.account));});
 if(name==='send'){content.querySelector('#rr-destination').value=state.address;content.querySelector('#rr-amount').value=state.amount;}
 if(state.removed)content.querySelectorAll('[data-go="pending"]').forEach(el=>el.hidden=true);
 if(state.cancelled){set('[data-pending-title]','Transfer cancelled');set('[data-pending-label]','Cancelled');set('[data-pending-note]','The transfer was cancelled. You can remove it from your history.');set('[data-cancel]','Remove from history');const check=content.querySelector('[data-check]');if(check)check.hidden=true;}
 content.querySelectorAll('button,summary').forEach(el=>el.classList.add('cursor-interaction'));
 if(globalThis.lucide)lucide.createIcons();
}
picker.addEventListener('change',()=>render(picker.value));
content.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b)return;
 if(b.dataset.go){render(b.dataset.go);return;}
 if(b.dataset.pick){state.account=b.dataset.pick;render('review');return;}
 if(b.dataset.contact){content.querySelector('#rr-destination').value=b.dataset.contact.toLowerCase()+'@example.com';return;}
 if(b.hasAttribute('data-fill'))content.querySelector('#rr-destination').value='alice@example.com';
 if(b.hasAttribute('data-continue')){const amount=Number(content.querySelector('#rr-amount').value),address=content.querySelector('#rr-destination').value.trim();if(!address||!Number.isSafeInteger(amount)||amount<=0){content.querySelector('#rr-validation').hidden=false;return;}state.amount=amount;state.address=address;state.recipient=address.split('@')[0];state.recipient=state.recipient.charAt(0).toUpperCase()+state.recipient.slice(1);render('review');return;}
 if(b.hasAttribute('data-share')||b.hasAttribute('data-copy')){const message=content.querySelector('.rr-local-message');if(message)message.hidden=false;}
 if(b.hasAttribute('data-hide-balance')){const hidden=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(hidden));content.querySelector('[data-balance]').textContent=hidden?'••••••':'845,200 sats';content.querySelector('[data-fiat]').textContent=hidden?'••••':'≈ $845.20';}
 if(b.hasAttribute('data-check'))content.querySelector('[data-pending-note]').textContent='Checked just now. Still waiting for the recipient.';
 if(b.hasAttribute('data-cancel')){if(state.cancelled){state.removed=true;render('activity');}else content.querySelector('.rr-confirm').hidden=false;}
 if(b.hasAttribute('data-keep'))content.querySelector('.rr-confirm').hidden=true;
 if(b.hasAttribute('data-confirm')){state.cancelled=true;render('pending');}
 if(b.dataset.requestTab){content.querySelectorAll('[data-request-tab]').forEach(el=>el.classList.toggle('rr-on',el===b));content.querySelector('[data-receive-label]').textContent=b.dataset.requestTab==='address'?'walter@kaleidoswap.me':'Waiting for payment';}
});
content.addEventListener('input',event=>{const input=event.target;if(input.hasAttribute('data-search-activity')||input.hasAttribute('data-search-settings'))content.querySelectorAll('[data-search]').forEach(el=>el.hidden=!el.dataset.search.includes(input.value.toLowerCase().trim()));});
render('home');
})();
</script>
